version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: medreach_postgres
    environment:
      POSTGRES_USER: medreach_user
      POSTGRES_PASSWORD: medreach_password
      POSTGRES_DB: medreach_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: medreach_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medreach_backend
    environment:
      DATABASE_URL: postgresql://medreach_user:medreach_password@postgres:5432/medreach_db
      SECRET_KEY: medreach_ai_super_secret_jwt_key_2026_hackathon_demo
      AI_OCR_PROVIDER: DEMO
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medreach_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
